# MkDocs 配置：文档站点（GitHub Pages 部署，见 .github/workflows/docs-pages.yml）
# 本地预览：mkdocs serve
site_name: kline-fetcher
site_description: A股K线数据获取与 qlib 格式转换工具
site_url: https://seuzxh.github.io/kline-fetcher/
repo_url: https://github.com/seuzxh/kline-fetcher
repo_name: seuzxh/kline-fetcher

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: 切换深色模式}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: 切换浅色模式}
  features:
    - navigation.top        # 返回顶部按钮
    - navigation.tracking   # 地址栏跟随锚点
    - navigation.sections   # 顶层导航分组显示
    - navigation.expand     # 左侧目录默认展开
    - content.code.copy     # 代码一键复制

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
      # unicode slug（小写+保留中文）：与 GitHub 锚点风格一致，
      # 文档内目录链接（如 #adjusttype-复权枚举）在站点和 GitHub 上都有效
      slugify: !!python/name:pymdownx.slugs.uslugify

nav:
  - 首页: index.md
  - 使用指南:
      - 配置: guide/configuration.md
      - 批量下载: guide/download.md
      - 在线调试服务: guide/server.md
      - 数据格式: guide/data-format.md
      - 使用示例: guide/usage.md
      - 测试与兼容: guide/testing.md
      - 常见问题: guide/faq.md
  - 深入了解:
      - 架构: architecture.md
      - 技术方案: design.md
  - API 参考: api-reference.md
  - 概念板块接口: concept_plate_api.md
  - 附录:
      - 原始抓包记录: API/概念板块请求API.md
      - 中焯官方接口文档: API/中焯官方文档/README.md
      - 更新日志: CHANGELOG.md
