[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-fetcher"
version = "1.1.0"
description = "A股K线数据获取与qlib格式转换工具"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9"]

[project.scripts]
kline-download = "kline_fetcher.download:main"

[tool.setuptools.packages.find]
include = ["kline_fetcher*"]

[tool.setuptools.package-data]
kline_fetcher = ["config/*.yaml"]
