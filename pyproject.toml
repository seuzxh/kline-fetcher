[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-fetcher"
version = "3.0.1"
description = "A股K线数据获取与qlib格式转换工具"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9"]
server = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
kline-download = "kline_fetcher.download:main"
kline-server = "kline_fetcher.server:main"

[tool.setuptools.packages.find]
include = ["kline_fetcher*"]

[tool.setuptools.package-data]
kline_fetcher = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 API 与网络的集成测试（默认不运行，手动用 -m integration 触发）",
]
addopts = "-m 'not integration'"
